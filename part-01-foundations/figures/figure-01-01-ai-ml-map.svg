<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440">
<style>text{font-family:Arial,sans-serif;fill:#17202a}.h{font-size:22px;font-weight:bold}.s{font-size:15px}.b{fill:#fff;stroke:#315b6d;stroke-width:2}.g{fill:#eef7f5;stroke:#28766d;stroke-width:2}.p{fill:#f7f3fa;stroke:#70558a;stroke-width:2}.a{stroke:#566573;stroke-width:2;marker-end:url(#m)}</style>
<defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#566573"/></marker></defs>
<rect x="30" y="30" rx="12" width="160" height="85" class="b"/><text x="110" y="67" text-anchor="middle" class="h">AI</text><text x="110" y="91" text-anchor="middle" class="s">Intelligent systems</text>
<line x1="190" y1="72" x2="235" y2="72" class="a"/>
<rect x="240" y="30" rx="12" width="200" height="85" class="g"/><text x="340" y="67" text-anchor="middle" class="h">Machine Learning</text><text x="340" y="91" text-anchor="middle" class="s">Learns from data</text>
<line x1="440" y1="72" x2="485" y2="72" class="a"/>
<rect x="490" y="30" rx="12" width="185" height="85" class="p"/><text x="582" y="67" text-anchor="middle" class="h">Deep Learning</text><text x="582" y="91" text-anchor="middle" class="s">Neural representations</text>
<line x1="675" y1="72" x2="720" y2="72" class="a"/>
<rect x="725" y="30" rx="12" width="190" height="85" class="p"/><text x="820" y="60" text-anchor="middle" class="h">Foundation</text><text x="820" y="86" text-anchor="middle" class="h">Models</text>
<line x1="915" y1="72" x2="960" y2="72" class="a"/>
<rect x="965" y="30" rx="12" width="200" height="85" class="p"/><text x="1065" y="60" text-anchor="middle" class="h">Generative AI</text><text x="1065" y="88" text-anchor="middle" class="s">Creates new content</text>
<text x="40" y="165" class="h">Ways ML systems learn</text>
<rect x="40" y="190" rx="10" width="250" height="85" class="b"/><text x="165" y="225" text-anchor="middle" class="h">Supervised</text><text x="165" y="252" text-anchor="middle" class="s">Labeled outcomes</text>
<rect x="315" y="190" rx="10" width="250" height="85" class="b"/><text x="440" y="225" text-anchor="middle" class="h">Unsupervised</text><text x="440" y="252" text-anchor="middle" class="s">Discover structure</text>
<rect x="590" y="190" rx="10" width="270" height="85" class="p"/><text x="725" y="225" text-anchor="middle" class="h">Self / Semi-Supervised</text><text x="725" y="252" text-anchor="middle" class="s">Leverage unlabeled data</text>
<rect x="885" y="190" rx="10" width="275" height="85" class="b"/><text x="1022" y="225" text-anchor="middle" class="h">Reinforcement</text><text x="1022" y="252" text-anchor="middle" class="s">Interaction and rewards</text>
<rect x="145" y="325" rx="12" width="910" height="75" class="g"/><text x="600" y="356" text-anchor="middle" class="h">Central question</text><text x="600" y="382" text-anchor="middle" class="s">Will what the model learns generalize appropriately to new, unseen data?</text>
</svg>